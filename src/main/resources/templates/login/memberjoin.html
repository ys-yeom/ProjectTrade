<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/css/login.css">
  <title>Title</title>
</head>
<body>
<main id="container" class="login_container" layout:fragment="content">
  <section class="contents">
    <div class="inner">
      <div class="join">
        <h2>회원가입</h2>
        <form>
          <fieldset>
            <legend>회원가입</legend>
            <div class="join_wrap">
              <label for="username">아이디</label>
              <input type="text" id="username" name="username" placeholder="사용하실 아이디를 입력해주세요." title="아이디" autocomplete="username">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <div class="join_wrap">
              <label for="userpassword">비밀번호</label>
              <input type="password" id="userpassword" name="userpassword" placeholder="사용하실 비밀번호를 입력해주세요." title="비밀번호" autocomplete="userpassword">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <div class="join_wrap">
              <label for="name">별명</label>
              <input type="text" id="name" name="name" placeholder="사용하실 별명을 입력해주세요." title="별명" autocomplete="name">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <div class="join_wrap">
              <label for="email">이메일</label>
              <input type="text" id="email" name="email" placeholder="사용하실 이메일 정보를 입력해주세요." title="이메일" autocomplete="email">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <div class="join_wrap">
              <label for="mobile">휴대전화</label>
              <input type="text" id="mobile" name="mobile" placeholder="하이픈(-) 없이 숫자만 입력해주세요." title="휴대전화" autocomplete="mobile">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <div class="join_wrap">
              <label for="address">주소</label>
              <input type="text" id="address" name="address" placeholder="주소를 입력해주세요." title="주소" autocomplete="address">
              <button type="button" class="delete_btn">
                <span class="blind">삭제</span>
              </button>
            </div>
            <button type="submit" class="login_btn">가입완료</button>
          </fieldset>
        </form>
      </div>
    </div>
  </section>
</main>
</body>
</html>
