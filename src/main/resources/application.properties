#spring.datasource.url=jdbc:mysql:thin:@localhost:3306:xe
spring.datasource.url=jdbc:mysql://localhost:3306/trade?serverTimezone=Asia/Seoul&characterEnscoding=UTF-8
spring.datasource.username=reon
spring.datasource.password=1234

# server port
server.port=8080
server.ssl.enabled=false

# static resource
spring.web.resources.static-locations=classpath:static/

#??????
server.servlet.encoding.force=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.thymeleaf.cache=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Mybatis setting
mybatis.type-aliases-package=com.trade.model
mybatis.mapper-locations=classpath:mappers/*.xml

#Spring Error
server.error.whitelabel.enabled=false





