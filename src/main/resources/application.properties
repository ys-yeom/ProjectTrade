spring.application.name=trade

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#spring.datasource.url=jdbc:oracle:thin:@192.168.1.40:1521:xe
#spring.datasource.url=jdbc:oracle:thin:@192.168.0.58:1521:xe
